<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Objetivos de Vida</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Meus Objetivos de Vida</h1>
        <p>O foco é a chave para a realização.</p>
    </header>

    <main class="container">
        <div class="card" id="obj-1">
            <h2>1. Me Formar</h2>
            <div class="countdown" id="timer-1">7 meses, 12 dias, 23 horas, 2 minuto e 6 segudos</div>
        </div>

        <div class="card" id="obj-2">
            <h2>2. Família Feliz</h2>
            <div class="countdown" id="timer-2">Carregando...</div>
        </div>

        <div class="card" id="obj-3">
            <h2>3. Bom Emprego</h2>
            <div class="countdown" id="timer-3"></div>
        </div>
    </main>

    <script src="main.js"></script>
</body>
</html>
